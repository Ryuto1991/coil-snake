</head><body><canvas id="c"></canvas><script>
'use strict';
(()=>{
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,vign=null,NARROW=false;
const FONT='"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic","Meiryo",sans-serif';
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;NARROW=W<620;
  cv.width=Math.max(1,W*DPR|0);cv.height=Math.max(1,H*DPR|0);
  vign=document.createElement('canvas');vign.width=Math.max(1,W);vign.height=Math.max(1,H);
  const g=vign.getContext('2d'),r=Math.hypot(W,H)/2;
  const gr=g.createRadialGradient(W/2,H/2,r*0.25,W/2,H/2,r);
  gr.addColorStop(0,'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,2,10,0.85)');
  g.fillStyle=gr;g.fillRect(0,0,W,H);
}
addEventListener('resize',resize);resize();
const Q=new URLSearchParams(location.search),DEMO=Q.has('demo');
let TOUCH=('ontouchstart' in window)||navigator.maxTouchPoints>0;
const TAU=Math.PI*2,rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v;
const angDiff=(a,b)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return d;};

// ---------- enemy types (world units) ----------
const STAGES=['細菌','細胞','細胞核'],STAGE_TAIL=[0,1000,1700],STAGE_S=[1,1.43,2.3],MAX_TAIL=3600;
const ETYPES=[
 // stage 0: bacteria
 {k:'germ',  st:0,r:9, hp:1, spd:80, dmg:7, xp:1, col:'#ff3b4e',core:'#ffb3bb',glow:'rgba(255,50,70,0.6)'},
 {k:'virus', st:0,r:11,hp:3, spd:64, dmg:9, xp:2, col:'#a944ff',core:'#e6c2ff',glow:'rgba(160,60,255,0.6)'},
 {k:'blob',  st:0,r:18,hp:10,spd:44, dmg:14,xp:6, col:'#ff2f95',core:'#ffc4e2',glow:'rgba(255,50,150,0.55)'},
 // stage 1: cells / organelles
 {k:'mito',  st:1,r:23,hp:4, spd:118,dmg:9, xp:5, col:'#ff8a3d',core:'#ffd8b0',glow:'rgba(255,130,50,0.55)',rot:1},
 {k:'cell',  st:1,r:29,hp:8, spd:96, dmg:11,xp:8, col:'#ff5e7a',core:'#7a1030',glow:'rgba(255,80,110,0.5)'},
 {k:'bigcell',st:1,r:44,hp:22,spd:70,dmg:16,xp:18,col:'#c25bff',core:'#4a137a',glow:'rgba(180,80,255,0.5)'},
 // stage 2: nuclei / giants
 {k:'nucleus',st:2,r:58,hp:14,spd:150,dmg:12,xp:16,col:'#b86cff',core:'#3c0f6a',glow:'rgba(170,90,255,0.5)'},
 {k:'amoeba',st:2,r:76,hp:32,spd:122,dmg:16,xp:30,col:'#ff4fa0',core:'#6a0f3c',glow:'rgba(255,70,160,0.45)'},
 {k:'giant', st:2,r:105,hp:70,spd:96, dmg:22,xp:60,col:'#ff6a3d',core:'#5a1a08',glow:'rgba(255,110,60,0.45)'},
];
function mk(w,h){const c=document.createElement('canvas');c.width=Math.max(1,w|0);c.height=Math.max(1,h|0);return c;}
function glowSprite(r,col){r=Math.round(r);const s=mk(r*2,r*2),g=s.getContext('2d'),gr=g.createRadialGradient(r,r,0,r,r,r);
  gr.addColorStop(0,col);gr.addColorStop(0.4,col.replace(/[\d.]+\)$/,m=>(parseFloat(m)*0.35).toFixed(3)+')'));gr.addColorStop(1,'rgba(0,0,0,0)');
  g.fillStyle=gr;g.fillRect(0,0,r*2,r*2);return s;}
function circ(g,x,y,r){g.beginPath();g.arc(x,y,r,0,TAU);}
function drawBody(g,t,fl){
  const r=t.r,col=fl?'#ffffff':t.col,core=fl?'#ffffff':t.core;
  switch(t.k){
  case 'germ':g.fillStyle=col;circ(g,0,0,r);g.fill();g.fillStyle=core;g.globalAlpha=.8;circ(g,-r*.25,-r*.25,r*.38);g.fill();
    g.globalAlpha=.5;g.fillStyle='#000';circ(g,r*.2,r*.15,r*.18);g.fill();break;
  case 'virus':g.strokeStyle=col;g.lineWidth=2;g.fillStyle=core;
    for(let i=0;i<9;i++){const a=i/9*TAU;g.beginPath();g.moveTo(Math.cos(a)*r*.7,Math.sin(a)*r*.7);g.lineTo(Math.cos(a)*(r+5),Math.sin(a)*(r+5));g.stroke();circ(g,Math.cos(a)*(r+5),Math.sin(a)*(r+5),1.8);g.fill();}
    g.fillStyle=col;circ(g,0,0,r*.8);g.fill();g.fillStyle=core;g.globalAlpha=.8;circ(g,-r*.2,-r*.2,r*.3);g.fill();break;
  case 'blob':g.fillStyle=col;for(let i=0;i<5;i++){const a=i/5*TAU;circ(g,Math.cos(a)*r*.45,Math.sin(a)*r*.45,r*.6);g.fill();}
    circ(g,0,0,r);g.fill();g.fillStyle=core;g.globalAlpha=.8;circ(g,-r*.25,-r*.25,r*.38);g.fill();break;
  case 'mito':{const L=r*1.15,w=r*.62;g.fillStyle=col;g.beginPath();g.roundRect?g.roundRect(-L,-w,2*L,2*w,w):g.rect(-L,-w,2*L,2*w);g.fill();
    g.strokeStyle=fl?'#fff':'#ffb27a';g.lineWidth=2;g.beginPath();g.roundRect?g.roundRect(-L+3,-w+3,2*L-6,2*w-6,w-3):0;g.stroke();
    g.strokeStyle=core;g.lineWidth=2.2;g.beginPath();for(let i=0;i<=24;i++){const x=-L*.78+i/24*L*1.56,y=Math.sin(i/24*TAU*3.2)*w*.55;i?g.lineTo(x,y):g.moveTo(x,y);}g.stroke();break;}
  case 'cell':g.fillStyle=col;g.globalAlpha=.55;circ(g,0,0,r);g.fill();g.globalAlpha=1;g.strokeStyle=col;g.lineWidth=3;circ(g,0,0,r-1.5);g.stroke();
    g.fillStyle=fl?'#fff':'#ffc0cc';for(let i=0;i<7;i++){const a=i*2.4,d=r*(.45+.35*((i*37)%10)/10);circ(g,Math.cos(a)*d,Math.sin(a)*d,1.6);g.fill();}
    g.fillStyle=core;circ(g,r*.12,-r*.08,r*.36);g.fill();g.fillStyle=col;circ(g,r*.18,-r*.12,r*.12);g.fill();break;
  case 'bigcell':g.fillStyle=col;g.globalAlpha=.5;circ(g,0,0,r);g.fill();g.globalAlpha=1;g.strokeStyle=col;g.lineWidth=4;circ(g,0,0,r-2);g.stroke();
    g.strokeStyle=fl?'#fff':'#e8b0ff';g.lineWidth=1.5;for(let i=0;i<3;i++){g.beginPath();g.arc(-r*.2,r*.2,r*(.5+i*.08),2.2,3.6);g.stroke();}
    g.fillStyle=core;circ(g,r*.15,-r*.1,r*.38);g.fill();g.fillStyle=col;circ(g,r*.22,-r*.15,r*.13);g.fill();break;
  case 'nucleus':g.fillStyle=col;circ(g,0,0,r);g.fill();g.strokeStyle=fl?'#fff':'#e6c8ff';g.lineWidth=3;circ(g,0,0,r-3);g.stroke();g.lineWidth=1.5;circ(g,0,0,r-8);g.stroke();
    g.fillStyle=fl?'#fff':'rgba(255,255,255,.35)';for(let i=0;i<10;i++){const a=i*1.9,d=r*.55;circ(g,Math.cos(a)*d,Math.sin(a)*d,1.8);g.fill();}
    g.strokeStyle=core;g.lineWidth=2;for(let i=0;i<5;i++){const a=i*1.3;g.beginPath();g.arc(Math.cos(a)*r*.45,Math.sin(a)*r*.45,r*.15,a,a+2.4);g.stroke();}
    g.fillStyle=core;circ(g,r*.08,r*.05,r*.32);g.fill();break;
  case 'amoeba':g.fillStyle=col;g.globalAlpha=.75;for(let i=0;i<7;i++){const a=i/7*TAU+.3,d=r*(.42+.18*Math.sin(i*2.7));circ(g,Math.cos(a)*d,Math.sin(a)*d,r*(.42+.12*Math.cos(i*1.9)));g.fill();}
    circ(g,0,0,r*.75);g.fill();g.globalAlpha=1;g.fillStyle=fl?'#fff':'#ffc0dd';for(let i=0;i<4;i++){circ(g,Math.cos(i*1.7+1)*r*.4,Math.sin(i*1.7+1)*r*.4,r*.08);g.fill();}
    g.fillStyle=core;circ(g,-r*.1,r*.05,r*.27);g.fill();break;
  case 'giant':g.fillStyle=col;g.globalAlpha=.45;circ(g,0,0,r);g.fill();g.globalAlpha=1;g.strokeStyle=col;g.lineWidth=5;circ(g,0,0,r-2.5);g.stroke();
    g.fillStyle=fl?'#fff':'#ffb07a';for(let i=0;i<5;i++){const a=i*1.25+.4,d=r*.6;g.save();g.translate(Math.cos(a)*d,Math.sin(a)*d);g.rotate(a);g.beginPath();g.roundRect?g.roundRect(-r*.13,-r*.06,r*.26,r*.12,r*.06):g.rect(-r*.13,-r*.06,r*.26,r*.12);g.fill();g.restore();}
    g.strokeStyle=fl?'#fff':'#ffd0a8';g.lineWidth=2;for(let i=0;i<3;i++){g.beginPath();g.arc(r*.05,0,r*(.38+i*.07),3.6,5.2);g.stroke();}
    g.fillStyle=core;circ(g,r*.05,0,r*.3);g.fill();g.fillStyle=col;circ(g,r*.1,-r*.05,r*.11);g.fill();break;
  }
  g.globalAlpha=1;
}
function bodySprite(t,fl){const ext=t.k==='mito'?t.r*1.2:t.r,S=(ext+8)*2,s=mk(S,S),g=s.getContext('2d');g.translate(S/2,S/2);drawBody(g,t,fl);return s;}
for(const t of ETYPES){t.spr=bodySprite(t,0);t.fspr=bodySprite(t,1);t.gspr=glowSprite(Math.min(64,t.r*2.6),t.glow);t.gR=t.r*2.6;}
const HEADGLOW=glowSprite(60,'rgba(80,255,140,0.55)');
const ORBGLOW=glowSprite(14,'rgba(70,170,255,0.8)');
const CAPGLOW=glowSprite(24,'rgba(120,255,170,0.7)');

// ---------- input ----------
const keys=new Set();let mdown=false,mx=0,my=0,mouseUsed=false,dashTouch=null,steerTouch=null;
let tapCand=null; // {id,x,y,t,moved,savedMx,savedMy} short-tap → dash without yanking aim
mx=W/2+100;my=H/2;
const TAP_MS=200,TAP_MOVE=18;
addEventListener('mouseup',()=>mdown=false);
addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;mouseUsed=true;});
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();keys.add(k);
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(k===' '&&!e.repeat)act('dash');
  if(k==='r'&&state==='over')reset(true);
  if(state==='level'&&['1','2','3'].includes(k))pick(+k-1);
  if(k==='enter'&&state==='title')reset(true);
});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));
cv.addEventListener('mousedown',e=>{mx=e.clientX;my=e.clientY;if(e.button===0){mdown=true;act('click');}});
cv.addEventListener('contextmenu',e=>e.preventDefault());
function dashBtn(){return{x:W-74,y:H-96,r:46};}
function inDashBtn(x,y){const b=dashBtn();return Math.hypot(x-b.x,y-b.y)<b.r+16;}
function promoteSteer(tc){
  if(!tc||tc.moved)return;
  tc.moved=true;mx=tc.x;my=tc.y;mouseUsed=true;
}
cv.addEventListener('touchstart',e=>{
  TOUCH=true;e.preventDefault();
  for(const t of e.changedTouches){
    if(state==='play'&&inDashBtn(t.clientX,t.clientY)){dashTouch=t.identifier;mdown=true;dash();}
    else if(state==='play'&&steerTouch!==null&&t.identifier!==steerTouch){
      // second finger anywhere → dash (keep existing feel)
      dashTouch=t.identifier;mdown=true;dash();
    }
    else if(state==='play'){
      // defer aim until drag/hold so a quick tap-dash won't yank steering
      steerTouch=t.identifier;
      tapCand={id:t.identifier,sx:t.clientX,sy:t.clientY,x:t.clientX,y:t.clientY,t:performance.now(),moved:false,savedMx:mx,savedMy:my};
    }
    else{steerTouch=t.identifier;mx=t.clientX;my=t.clientY;mouseUsed=true;act('tap');}
  }},{passive:false});
cv.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier!==steerTouch)continue;
    if(tapCand&&tapCand.id===t.identifier&&!tapCand.moved){
      tapCand.x=t.clientX;tapCand.y=t.clientY;
      const dist=Math.hypot(t.clientX-tapCand.sx,t.clientY-tapCand.sy);
      if(dist>TAP_MOVE)promoteSteer(tapCand);
    }else{mx=t.clientX;my=t.clientY;}
  }
},{passive:false});
function tEnd(e){
  for(const t of e.changedTouches){
    if(t.identifier===dashTouch){dashTouch=null;mdown=false;}
    if(t.identifier===steerTouch){
      if(tapCand&&tapCand.id===t.identifier){
        const dt=performance.now()-tapCand.t;
        const dist=Math.hypot(t.clientX-tapCand.sx,t.clientY-tapCand.sy);
        // short + little move → dash; restore aim so tap doesn't yank direction
        if(!tapCand.moved&&dt<TAP_MS&&dist<=TAP_MOVE){
          mx=tapCand.savedMx;my=tapCand.savedMy;dash();
        }else if(!tapCand.moved){
          // held in place: start steering toward that spot
          mx=t.clientX;my=t.clientY;mouseUsed=true;
        }
        tapCand=null;
      }
      steerTouch=null;
    }
  }
}
cv.addEventListener('touchend',tEnd);cv.addEventListener('touchcancel',tEnd);
// promote deferred tap to steer if held past TAP_MS without moving
setInterval(()=>{
  if(tapCand&&!tapCand.moved&&steerTouch===tapCand.id&&performance.now()-tapCand.t>=TAP_MS)promoteSteer(tapCand);
},40);
function act(kind){
  if(state==='title'){reset(true);return;}
  if(state==='over'){if(overT>0.6)reset(true);return;}
  if(state==='level'){if(kind!=='dash'){const i=cardAt(mx,my);if(i>=0)pick(i);}return;}
  if(state==='play'&&kind!=='tap')dash();
}

// ---------- state ----------
let state='title',P,enemies,orbs,parts,texts,rings,captures,ghosts,T,kills,bestCombo,spawnT,shake,hitstop,choices,overT,pendingLv,flashT,banner,stageT;
function stageOf(len){return len>=STAGE_TAIL[2]?2:len>=STAGE_TAIL[1]?1:0;}
function targetS(len){return clamp(Math.pow(len/640,0.8),1,2.8);}
function reset(start){
  const tl=+Q.get('tail')||640;
  P={x:0,y:0,a:0,spd:195,turn:4.0,hp:100,maxHp:100,inv:0,tailLen:tl,dashCd:2.2,dashT:0,dashCdT:0,dashAge:0,ghostT:0,
     dashBase:0.55,dashHoldMax:0.85,dashStacks:0,
     trail:[{x:0,y:0,s:0}],serial:1,minSerial:0,loopCd:0,S:targetS(tl),stage:stageOf(tl),
     pulseR:72,pulseDmg:1,pulseInt:1.1,pulseT:0.5,magnet:95,blast:1,lvl:1,xp:0,xpNeed:55};
  enemies=[];orbs=[];parts=[];texts=[];rings=[];captures=[];ghosts=[];
  T=0;kills=0;bestCombo=0;spawnT=1.0;shake=0;hitstop=0;choices=null;overT=0;pendingLv=0;flashT=0;banner=null;stageT=0;
  state=start?'play':'title';
  if(start)for(let i=0;i<(Q.has('swarm')?26:3);i++)spawnCluster(Q.has('swarm')?12:10);
}

// ---------- helpers ----------
function segInt(ax,ay,bx,by,cx,cy,dx,dy){
  const rx=bx-ax,ry=by-ay,sx=dx-cx,sy=dy-cy,den=rx*sy-ry*sx;if(Math.abs(den)<1e-9)return null;
  const t=((cx-ax)*sy-(cy-ay)*sx)/den,u=((cx-ax)*ry-(cy-ay)*rx)/den;
  if(t>=0&&t<=1&&u>=0&&u<=1)return{x:ax+rx*t,y:ay+ry*t};return null;
}
function polyArea(p){let a=0;for(let i=0,j=p.length-1;i<p.length;j=i++)a+=p[j].x*p[i].y-p[i].x*p[j].y;return a/2;}
function centroid(p){let x=0,y=0;for(const q of p){x+=q.x;y+=q.y;}return{x:x/p.length,y:y/p.length};}
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];
  if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x)c=!c;}return c;}
function bbox(p){let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const q of p){if(q.x<x0)x0=q.x;if(q.x>x1)x1=q.x;if(q.y<y0)y0=q.y;if(q.y>y1)y1=q.y;}return{x0,y0,x1,y1};}
function burst(x,y,n,col,sp,life,size){const S=P.S;for(let i=0;i<n&&parts.length<2200;i++){const a=Math.random()*TAU,v=rand(0.2,1)*sp*S;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(0.5,1)*life,max:life,col,size:size*S*rand(0.6,1.2)});}}
function text(x,y,s,size,col,life){texts.push({x,y,s,size,col,life:life||1,max:life||1});}

// ---------- spawning ----------
function pickType(){
  const st=P.stage,ts=T-stageT,r=Math.random();
  if(st>0&&r<0.22){const prev=ETYPES.filter(t=>t.st===st-1);return prev[Math.random()*prev.length|0];}
  const base=ETYPES.filter(t=>t.st===st),q=Math.random();
  const t0=st===0?T:ts+20,p2=Math.min(0.45,t0/160),p3=t0>50?Math.min(0.14,(t0-50)/450):0;
  return q<p3?base[2]:q<p3+p2?base[1]:base[0];
}
function spawnCluster(n){
  const S=P.S,a=Math.random()*TAU,d=Math.hypot(W,H)/2*S+40*S+Math.random()*80*S;
  const cx=P.x+Math.cos(a)*d,cy=P.y+Math.sin(a)*d,spread=(24+Math.sqrt(n)*12)*S;
  const hpS=1+T/240,cap=P.stage===2?320:P.stage===1?400:520;
  for(let i=0;i<n&&enemies.length<cap;i++){
    const t=pickType(),aa=Math.random()*TAU,rr=Math.sqrt(Math.random())*spread;
    enemies.push({x:cx+Math.cos(aa)*rr,y:cy+Math.sin(aa)*rr,vx:0,vy:0,t,hp:Math.ceil(t.hp*hpS),r:t.r,ang:0,
      spd:t.spd*rand(0.85,1.1)*(1+Math.min(0.3,T/500)),flash:0,cap:null,dead:false,ph:Math.random()*TAU});
  }
}

// ---------- combat ----------
function hurt(e,d,xpMul){e.hp-=d;e.flash=0.1;if(e.hp<=0&&!e.dead){kill(e,xpMul===undefined?1:xpMul);return true;}return false;}
function kill(e,xpMul){
  e.dead=true;burst(e.x,e.y,6,e.t.col,140,0.45,3);kills++;
  const v=e.t.xp*xpMul;
  if(orbs.length<450)orbs.push({x:e.x+rand(-6,6),y:e.y+rand(-6,6),v,ph:Math.random()*TAU,vx:rand(-40,40),vy:rand(-40,40)});
  else addXP(v);
}
function addXP(v){P.xp+=v;while(P.xp>=P.xpNeed){P.xp-=P.xpNeed;P.lvl++;P.xpNeed=Math.round(40+P.lvl*10+P.lvl*P.lvl*1.5);pendingLv++;}}
function dash(){
  if(state!=='play'||P.dashCdT>0)return;
  P.dashT=P.dashBase;P.dashAge=0;P.dashCdT=P.dashCd;P.ghostT=0;
  burst(P.x,P.y,22,'#9dffc4',240,0.4,3);
  rings.push({x:P.x,y:P.y,r:6*P.S,R:60*P.S,life:0.3,max:0.3,col:'#d8ffe6',w:4*P.S});
  let any=false;for(const c of captures)if(c.cinchT<0){c.cinchT=0;c.dash=true;any=true;}
  shake=Math.max(shake,any?7:3);
}
const CAPT_TIME=1.6;
function onLoop(poly){
  const c=centroid(poly);let rad=0;for(const q of poly)rad+=Math.hypot(q.x-c.x,q.y-c.y);rad/=poly.length;
  let cap=captures.find(k=>k.cinchT<0&&Math.hypot(k.c.x-c.x,k.c.y-c.y)<k.rad*1.2+30*P.S);
  if(cap){cap.charge=Math.min(6,cap.charge+1);cap.poly=poly;cap.c=c;cap.rad=rad;cap.timer=CAPT_TIME;cap.pop=1;
    text(c.x,c.y-rad,cap.charge+'重巻き！',22+cap.charge*3,'#b6ffd2',0.8);}
  else{cap={poly,c,rad,charge:1,timer:CAPT_TIME,cinchT:-1,dash:false,pop:1};captures.push(cap);text(c.x,c.y-rad,'包囲！',22,'#b6ffd2',0.7);}
  const b=bbox(poly);
  for(const e of enemies){if(e.dead||e.x<b.x0||e.x>b.x1||e.y<b.y0||e.y>b.y1)continue;if(inPoly(e.x,e.y,poly))e.cap=cap;}

function advanceTrail(dt){

let CELL=32;const grid=new Map();
function buildGrid(){grid.clear();let m=16;for(const e of enemies)if(e.r>m)m=e.r;CELL=Math.max(32,m*2);
  for(const e of enemies){const k=((e.x/CELL)|0)*73856093^((e.y/CELL)|0)*19349663;let a=grid.get(k);if(!a)grid.set(k,a=[]);a.push(e);}}

// ---------- update ----------
function update(dt){
  T+=dt;

  const S=P.S;
  let desired=P.a,kx=0,ky=0;
  if(keys.has('a')||keys.has('arrowleft'))kx--;if(keys.has('d')||keys.has('arrowright'))kx++;
  if(keys.has('w')||keys.has('arrowup'))ky--;if(keys.has('s')||keys.has('arrowdown'))ky++;
  if(DEMO){desired=P.a+(Math.sin(T*0.3)<-0.7?0.4:2.25)*dt;}
  else if(kx||ky)desired=Math.atan2(ky,kx);
  else{const dx=mx-W/2,dy=my-H/2;if(dx*dx+dy*dy>100)desired=Math.atan2(dy,dx);}
  const tr=P.turn*(P.dashT>0?1.3:1)*dt;P.a+=clamp(angDiff(P.a,desired),-tr,tr);
  const sp=P.spd*S*(P.dashT>0?2.3:1);
  P.x+=Math.cos(P.a)*sp*dt;P.y+=Math.sin(P.a)*sp*dt;
  if(P.dashT>0){P.dashT-=dt;P.dashAge+=dt;if((mdown||keys.has(' '))&&P.dashAge<P.dashHoldMax)P.dashT=Math.max(P.dashT,0.02);
    P.ghostT-=dt;if(P.ghostT<=0){P.ghostT=0.04;ghosts.push({x:P.x,y:P.y,a:P.a,life:0.32});}
    if(Math.random()<0.9)burst(P.x-Math.cos(P.a)*12*S,P.y-Math.sin(P.a)*12*S,1,'#b6ffd2',40,0.35,3);}
  if(P.dashCdT>0)P.dashCdT-=dt;
  if(P.inv>0)P.inv-=dt;
  if(DEMO&&captures.some(c=>c.cinchT<0&&c.charge>=2))dash();
  advanceTrail(dt);
  // spawn
  spawnT-=dt;
  if(spawnT<=0){spawnT=Math.max(0.7,2.6-T*0.016);const k=Math.sqrt(P.S)*(P.stage===2?0.85:1);spawnCluster(Math.round(Math.min(48,7+T*0.2)*rand(0.8,1.25)*k));
    if(T>40&&Math.random()<0.3)spawnCluster(Math.round(Math.min(30,4+T*0.1)*k));}
  // pulse
  P.pulseT-=dt;
  if(P.pulseT<=0){P.pulseT=P.pulseInt;const R=P.pulseR*S;rings.push({x:P.x,y:P.y,r:10*S,R,life:0.25,max:0.25,col:'#5dffa0',w:3*S,follow:1});
    for(const e of enemies){if(e.dead)continue;const dx=e.x-P.x,dy=e.y-P.y,rr=R+e.r;
      if(dx*dx+dy*dy<rr*rr){if(!hurt(e,P.pulseDmg*(1+P.stage),1)){const d=Math.hypot(dx,dy)+1;e.vx+=dx/d*140*S;e.vy+=dy/d*140*S;}}}}
  // enemies
  buildGrid();
  const far=Math.hypot(W,H)*1.1*S,headR=10*S,foodR=7*S;
  for(const e of enemies){
    if(e.dead)continue;
    const dx=P.x-e.x,dy=P.y-e.y,d=Math.hypot(dx,dy)+0.001;
    if(d>far&&!e.cap){e.dead=true;continue;}
    const s=e.spd*Math.max(0.8,S/STAGE_S[e.t.st])*(e.cap?0.22:1);let ax=dx/d*s,ay=dy/d*s;
    const gx=(e.x/CELL)|0,gy=(e.y/CELL)|0;let sx=0,sy=0;

      for(const o of a){if(o===e)continue;const qx=e.x-o.x,qy=e.y-o.y,m=e.r+o.r;const q2=qx*qx+qy*qy;

      if(P.dashT>0){if(!hurt(e,2*(1+P.stage),1)){e.vx-=dx/d*300*S;e.vy-=dy/d*300*S;}}
      else if(P.inv<=0&&!DEMO){P.hp-=e.t.dmg;P.inv=0.75;shake=Math.max(shake,8);burst(P.x,P.y,14,'#ff6070',200,0.4,3);
        text(P.x,P.y-30*S,'-'+e.t.dmg,18,'#ff7080',0.6);e.vx-=dx/d*260*S;e.vy-=dy/d*260*S;
        if(P.hp<=0){P.hp=0;state='over';overT=0;burst(P.x,P.y,80,'#7dffb0',380,1.2,4);}}
    }
  }
  for(const c of captures){c.pop=Math.max(0,c.pop-dt*3);
    if(c.cinchT<0){c.timer-=dt;if(c.timer<=0){c.cinchT=0;c.dash=false;}}
    else{c.cinchT+=dt;if(c.cinchT>=0.2){explode(c);c.done=true;}}}

  ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  for(const g of ghosts)drawHead(g.x,g.y,g.a,S*1.05,g.life/0.32*0.55);

    ctx.globalCompositeOperation='lighter';const hg=(P.dashT>0?1.7:1)*S;ctx.drawImage(HEADGLOW,P.x-60*hg,P.y-60*hg,120*hg,120*hg);ctx.globalCompositeOperation='source-over';

  if(banner){const a=Math.min(1,banner.t*2,(2.4-banner.t)*4),y=H*0.3;ctx.globalAlpha=a;
    ctx.fillStyle='rgba(3,20,30,0.6)';ctx.fillRect(0,y-46,W,92);
    ctx.font=`900 ${Math.min(44,W/9)|0}px ${FONT}`;ctx.lineWidth=6;ctx.strokeStyle='rgba(0,30,15,0.9)';ctx.strokeText(banner.title,W/2,y-12);
    ctx.fillStyle='#eaffb0';ctx.fillText(banner.title,W/2,y-12);ctx.font=`bold 18px ${FONT}`;ctx.fillStyle='#b6ffd2';ctx.fillText(banner.sub,W/2,y+26);ctx.globalAlpha=1;}

function panel(x,y,w,h,a){ctx.fillStyle=`rgba(3,14,34,${a||0.7})`;ctx.strokeStyle='rgba(100,200,255,0.25)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,10):ctx.rect(x,y,w,h);ctx.fill();ctx.stroke();}
function hud(){
  ctx.textBaseline='middle';
  ctx.fillStyle='rgba(10,30,60,0.8)';ctx.fillRect(0,0,W,6);ctx.fillStyle='#4aa8ff';ctx.fillRect(0,0,W*Math.min(1,P.xp/P.xpNeed),6);
  const lw=NARROW?Math.min(170,W*0.44):230,bw=lw-50;
  panel(10,12,lw,58);
  ctx.fillStyle='#bfe3ff';ctx.font=`bold 12px ${FONT}`;ctx.textAlign='left';ctx.fillText('HP',18,29);
  ctx.fillStyle='#2a0d16';ctx.fillRect(42,22,bw,14);ctx.fillStyle=P.hp/P.maxHp<0.3?'#ff4a5a':'#5dff9a';ctx.fillRect(42,22,bw*P.hp/P.maxHp,14);
  ctx.fillStyle='#fff';ctx.font=`bold 11px ${FONT}`;ctx.fillText(Math.ceil(P.hp)+' / '+P.maxHp,46,29);
  ctx.fillStyle='#bfe3ff';ctx.font=`bold 12px ${FONT}`;ctx.fillText('Lv '+P.lvl+'  XP '+Math.floor(P.xp)+'/'+P.xpNeed,18,54);
  const rw=NARROW?Math.min(140,W*0.36):200;

  ctx.fillText('撃破 '+kills,W-rw,29);ctx.fillStyle='#b6ffd2';ctx.fillText('最大コンボ x'+bestCombo,W-rw,52);
  // timer + scale
  const m=Math.floor(T/60),s=Math.floor(T%60),ty=NARROW?90:34;
  ctx.textAlign='center';ctx.font=`900 ${NARROW?22:28}px ${FONT}`;ctx.fillStyle='#e8f6ff';ctx.fillText(m+':'+(s<10?'0':'')+s,W/2,ty);
  const parts2=['スケール:',...STAGES.flatMap((n,i)=>i?['→',n]:[n])];
  ctx.font=`bold ${NARROW?12:13}px ${FONT}`;let tw=0;const ws=parts2.map(p=>{const w=ctx.measureText(p).width+6;tw+=w;return w;});

    ctx.fillStyle='rgba(90,140,170,0.35)';ctx.fillRect(W/2-tw/2,sy+12,tw,3);ctx.fillStyle='#7dffb0';ctx.fillRect(W/2-tw/2,sy+12,tw*f,3);}

  if(TOUCH){const b=dashBtn();bx=b.x;by=b.y;br=b.r;x0=16;cy2=H-60;}else{bx=W/2;by=H-58;br=34;x0=W/2+52;cy2=by;}

  if(best.charge){ctx.fillStyle='rgba(180,255,210,0.8)';ctx.fillRect(x0,cy2+14,104*best.timer/CAPT_TIME,4);

      if(TOUCH){ctx.textAlign='right';ctx.fillText('今だ！DASH →',bx-br-10,by);}else{ctx.textAlign='right';ctx.fillText('今だ！ダッシュで締めろ',bx-br-16,by);}}}

function fitFont(txt,size,weight,maxW){let f=size;ctx.font=`${weight} ${f}px ${FONT}`;while(f>9&&ctx.measureText(txt).width>maxW){f-=1;ctx.font=`${weight} ${f}px ${FONT}`;}return f;}

  ctx.fillStyle='rgba(2,8,22,0.6)';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.textBaseline='middle';

// ---------- loop ----------
reset(DEMO);
let last=performance.now();
function frame(now){
  const dt=Math.min(0.033,(now-last)/1000);last=now;
  if(state==='play'){if(hitstop>0)hitstop-=dt;else update(dt);updateFx(dt);}

requestAnimationFrame(frame);
window.__g={get s(){return{state,T,kills,bestCombo,enemies:enemies.length,orbs:orbs.length,lvl:P.lvl,hp:P.hp,captures:captures.length,
